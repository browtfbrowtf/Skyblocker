name: Build Release

# Controls when the action will run.
# Publishes a rolling "latest" release on every push to main, and can also
# be triggered manually.
on:
  workflow_dispatch:
  push:
    branches:
      - main

# The built-in GITHUB_TOKEN can publish a release in THIS repo with contents:write,
# so no custom API key / PAT is required.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Build with Gradle
        run: ./gradlew build

      - name: Process artifacts
        uses: actions/github-script@v8
        id: fname
        with:
          result-encoding: string
          script: |
            const fs = require("fs")
            return fs.readdirSync("build/libs/").filter(e => !e.endsWith("dev.jar") && !e.endsWith("sources.jar") && e.endsWith(".jar"))[0].replace(".jar", "");

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.fname.outputs.result }}
          path: build/libs/

      # Rolling release: reuses the fixed "latest" tag, so every run overwrites the
      # same release and the repo's Latest release is always the freshest build.
      - name: Publish GitHub Release (rolling "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          target_commitish: ${{ github.sha }}
          files: build/libs/${{ steps.fname.outputs.result }}.jar
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
